apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: https://vault.default.yourdomain.tld
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: odoo-external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
