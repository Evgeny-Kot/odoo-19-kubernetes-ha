apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: oauth2-proxy-secrets
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: kv/odoo/dev
        property: oidc_client_id
    - secretKey: client_secret
      remoteRef:
        key: kv/odoo/dev
        property: oidc_client_secret
    - secretKey: cookie_secret
      remoteRef:
        key: kv/odoo/dev
        property: oidc_cookie_secret
